<!doctype html>
<!-- One-off source for public/og.png (1200×630, the OG/Twitter card size).
     Regenerate: chrome --headless=new --screenshot=..\public\og.png
     --window-size=1200,630 og-card.html -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Backend Ecosystem — OG card</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 72px 84px;
        background: #f4f6f3;
        color: #19313b;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .eyebrow {
        margin: 0 0 20px;
        color: #087c78;
        font-size: 24px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      .tagline {
        margin: 28px 0 0;
        color: #5a6c72;
        font-size: 34px;
        line-height: 1.4;
      }
      .rule {
        width: 140px;
        height: 6px;
        margin-top: 40px;
        border-radius: 3px;
        background: #087c78;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Learn by following a request</p>
    <h1>Backend Ecosystem</h1>
    <p class="tagline">See how a request travels from client to database — one step at a time.</p>
    <div class="rule"></div>
  </body>
</html>
